version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      # Group minor/patch updates to reduce PR noise
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
      production-patches:
        dependency-type: 'production'
        update-types: ['patch']
    # Held version pins — these two are pinned to exact versions in
    # mcp-server/package.json and must not float. workers-types >=5.20260807.2
    # declares `Buffer`/`process` as `any` at global scope, which shadows
    # @types/node across the whole mcp-server program; wrangler is ignored in
    # lockstep because its peer floor on workers-types rises nearly every
    # release. Rationale, evidence and the removal condition:
    # src/docs/development/DEVELOPER_TOOLING.md § Held version pins (and BL-137).
    # Delete BOTH entries together when the pins are lifted — leaving one
    # ignored re-creates the ERESOLVE this prevents.
    # NOTE: these are blanket ignores, so they would also suppress Dependabot
    # *security* PRs for these two packages. Moot today — security updates are
    # disabled repo-wide for this repo (see BL-136) — but if that is ever
    # turned on, narrow these to `update-types` rather than leaving them broad.
    ignore:
      - dependency-name: '@cloudflare/workers-types'
      - dependency-name: 'wrangler'
    reviewers:
      - 'reidperyam'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
