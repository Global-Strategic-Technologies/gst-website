version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      # Dependabot assigns an update to the FIRST group that matches, so this
      # stays above production-patches. @sentry/browser is pinned exactly to
      # the version @sentry/astro pins; the group moves them in lockstep so a
      # caret-free bump can never leave a second SDK copy behind.
      sentry:
        patterns: ['@sentry/*']
      # Group minor/patch updates to reduce PR noise
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
      production-patches:
        dependency-type: 'production'
        update-types: ['patch']
    # Held: @sentry/astro and @sentry/browser at 11.14.0 (2026-11-23). From
    # 11.15.0 (11.16.0 too) @sentry/astro's `sentry-astro-server-release` Vite
    # plugin reads `this.getModuleInfo(id).isEntry` in `transform`, which Vite 8
    # rejects, so `astro sync` fails. Only production builds load the
    # integration (it is gated on SENTRY_AUTH_TOKEN in astro.config.mjs), so the
    # Dependabot preview went green while the production deploy failed. Both are
    # held because they move in lockstep (see the `sentry` group). Exit
    # condition: a release whose `astro sync` passes with a dummy token, i.e.
    #   SENTRY_AUTH_TOKEN=x SENTRY_ORG=x SENTRY_PROJECT=x npx astro sync
    # Lift both entries then. See DEVELOPER_TOOLING.md § SDK version hold.
    #
    # `@cloudflare/workers-types` and `wrangler` were held here until BL-137
    # removed the dependence that made the hold necessary (ADR-0020). Both float
    # on carets again. A workers-types release that adds a global shadowing
    # @types/node now fails
    # mcp-server/tests/integration/workers-types-globals.test.ts on the
    # Dependabot PR, which is the signal that hold used to suppress.
    ignore:
      - dependency-name: '@sentry/astro'
        versions: ['>= 11.15.0']
      - dependency-name: '@sentry/browser'
        versions: ['>= 11.15.0']
    reviewers:
      - 'reidperyam'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
