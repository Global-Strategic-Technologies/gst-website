version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      # Dependabot assigns an update to the FIRST group that matches, so this
      # stays above production-patches. @sentry/browser is pinned exactly to
      # the version @sentry/astro pins; the group moves them in lockstep so a
      # caret-free bump can never leave a second SDK copy behind.
      sentry:
        patterns: ['@sentry/*']
      # Group minor/patch updates to reduce PR noise
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
      production-patches:
        dependency-type: 'production'
        update-types: ['patch']
    # Skipped: @sentry/astro and @sentry/browser 11.15.x and 11.16.x
    # (2026-11-23). In those releases @sentry/astro's
    # `sentry-astro-server-release` Vite plugin reads
    # `this.getModuleInfo(id).isEntry` in `transform` outside a build, which
    # Vite 8's dev-server container rejects, so `astro sync` fails. Only
    # production builds load the integration (it is gated on SENTRY_AUTH_TOKEN
    # in astro.config.mjs), so the Dependabot preview went green while the
    # production deploy failed. 11.17.0 scopes the plugin to builds and is NOT
    # skipped. Its preview will not prove it either, so run the
    # placeholder-credential `astro sync` before merging (see
    # DEVELOPER_TOOLING.md § SDK version hold). Both packages are listed because
    # they move in lockstep (the `sentry` group). Delete these entries once the
    # pins have moved past 11.16.x.
    #
    # `@cloudflare/workers-types` and `wrangler` were held here until BL-137
    # removed the dependence that made the hold necessary (ADR-0020). Both float
    # on carets again. A workers-types release that adds a global shadowing
    # @types/node now fails
    # mcp-server/tests/integration/workers-types-globals.test.ts on the
    # Dependabot PR, which is the signal that hold used to suppress.
    ignore:
      - dependency-name: '@sentry/astro'
        versions: ['>= 11.15.0, < 11.17.0']
      - dependency-name: '@sentry/browser'
        versions: ['>= 11.15.0, < 11.17.0']
    reviewers:
      - 'reidperyam'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
