name: npm audit

# Production-dependency vulnerability scan. Runs:
#   - Weekly cron (Monday 06:00 UTC) — catches advisories published after the
#     last lockfile change, so dormant dependencies don't quietly age into
#     CVE territory.
#   - On lockfile change — every PR that touches `package-lock.json` or
#     `mcp-server/package-lock.json` runs the audit so new vulnerabilities
#     surface at the moment the dependency is added.
#
# Moved out of the main Test Suite (2026-05-31) — running on every code
# change was wasteful: the audit result is a function of the lockfile only,
# not of source. The CLAUDE.md policy stays the same: "production
# dependencies must stay at zero advisories (enforced via
# `--audit-level=moderate --omit=dev` in CI). Dev-only advisories are
# tolerated case-by-case."

permissions:
  contents: read

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    # CI-validation branch list. Shares `[master, dev, 'feat/**', 'fix/**',
    # 'feature/**']` with test.yml and test-mcp-server.yml, PLUS 'dependabot/**'
    # so Dependabot rebases (which arrive as `synchronize`, not opened/reopened)
    # still run this required audit on the new head commit. The deploy workflows
    # (deploy-mcp-staging.yml, deploy-mcp-production.yml) deliberately OMIT
    # 'dependabot/**' — dependency bumps must be validated but never auto-deployed.
    # 'docs/**' + 'chore/**' added 2026-07-15: GitHub "Update branch" pushes
    # arrive as `synchronize` too, so these families need push-trigger coverage
    # or updated PRs stall BLOCKED (observed on PR #316). Kept in lockstep with
    # test.yml / test-mcp-server.yml.
    branches:
      [master, dev, 'feat/**', 'fix/**', 'feature/**', 'dependabot/**', 'docs/**', 'chore/**']
    paths:
      - 'package-lock.json'
      - 'mcp-server/package-lock.json'
      - '.github/workflows/npm-audit.yml'
  pull_request:
    branches: [master]
    types: [opened, reopened]
    paths:
      - 'package-lock.json'
      - 'mcp-server/package-lock.json'
      - '.github/workflows/npm-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    name: npm audit (production dependencies only)
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: npm audit --audit-level=moderate --omit=dev
        run: npm audit --audit-level=moderate --omit=dev
