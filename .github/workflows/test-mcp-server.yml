name: MCP Server Test Suite

permissions:
  contents: read

# Standalone workflow for the @gst/mcp-server workspace. Runs in parallel to
# the main Test Suite (test.yml) so MCP regressions are immediately
# attributable rather than commingled with site failures.
#
# Path filters (top-level) keep this workflow inert when changes don't affect
# the MCP surface — editing only Astro pages, components, or styles will not
# trigger this workflow. The trade-off vs the test.yml gate-job pattern: a
# skipped status is acceptable here because this workflow is NOT a required
# branch-protection check.

on:
  push:
    # Includes 'dependabot/**' (like test.yml / npm-audit.yml, unlike the deploy
    # workflows) so Dependabot rebases — which arrive as `synchronize`, not
    # opened/reopened — still validate the MCP surface on the new head commit.
    # deploy-mcp-staging.yml / deploy-mcp-production.yml gate on their own branch
    # list (no 'dependabot/**'), so dependency bumps are tested but never auto-deployed.
    branches: [master, dev, 'feat/**', 'fix/**', 'feature/**', 'dependabot/**']
    paths:
      - 'mcp-server/**'
      - '!mcp-server/**/*.md'
      - 'src/utils/diligence-engine.ts'
      - 'src/utils/filterLogic.ts'
      - 'src/schemas/diligence.ts'
      - 'src/schemas/portfolio.ts'
      - 'src/data/ma-portfolio/projects.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-mcp-server.yml'
  pull_request:
    branches: [master]
    # Deliberately NOT listening to `synchronize` — push covers every commit
    # added to a PR'd branch, and `synchronize` would duplicate-fire on every
    # PR sync. `opened` + `reopened` still gives one PR-context run on the
    # synthetic merge SHA so the merge result is independently validated.
    types: [opened, reopened]
    paths:
      - 'mcp-server/**'
      - '!mcp-server/**/*.md'
      - 'src/utils/diligence-engine.ts'
      - 'src/utils/filterLogic.ts'
      - 'src/schemas/diligence.ts'
      - 'src/schemas/portfolio.ts'
      - 'src/data/ma-portfolio/projects.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-mcp-server.yml'

concurrency:
  # Distinct group from test.yml so the two workflows run truly in parallel.
  # event_name in the key prevents push/PR cross-cancellation on the same ref.
  #
  # cancel-in-progress: true interacts with deploy-mcp-staging.yml's
  # workflow_run consumer correctly: if two pushes arrive ~simultaneously,
  # the in-progress test run is cancelled (status: cancelled, not success).
  # The downstream deploy workflow's `if: workflow_run.conclusion == 'success'`
  # filter then correctly suppresses the cancelled run's deploy chain, while
  # the winning push's deploy proceeds. Verified empirically 2026-05-31.
  group: mcp-server-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          # `setup-node`'s `cache: 'npm'` only caches the ~/.npm tarball
          # cache — `npm ci` still does the link/install pass (~30-40s).
          # Caching node_modules directly skips that step on cache hit.
          # Key includes lockfile + node version + a manual epoch we can
          # bump when we want to force a fresh install.
          path: |
            node_modules
            mcp-server/node_modules
          key: nm-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        run: npm -w @gst/mcp-server run typecheck

      - name: Build
        run: npm -w @gst/mcp-server run build

      - name: Run tests with coverage
        # Capture vitest's exit code via PIPESTATUS so the step's success
        # reflects test outcomes, not just tee's. Without this the `tee`
        # pipeline captures tee's exit code (always 0), masking vitest
        # failures and making the workflow report `success` while tests
        # are red. Surfaced 2026-05-27 by an audit of why the Ivy /
        # Valorem / Commodore portfolio merges shipped to master with 2
        # failing tests — CI reported green; failures only became visible
        # to the next contributor running `npm test` locally and got
        # dismissed as "pre-existing master debt." Both this workflow and
        # test.yml had the same bug; both fixed in the same commit.
        #
        # PIPESTATUS[0] is bash-specific — `shell: bash` is required.
        shell: bash
        run: |
          npm -w @gst/mcp-server run test -- --coverage 2>&1 | tee coverage-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          SUMMARY=$(grep "^All files" coverage-output.txt || echo "")
          if [ -n "$SUMMARY" ]; then
            STMTS=$(echo "$SUMMARY" | awk -F'|' '{gsub(/ /,"",$2); print $2}')
            BRANCH=$(echo "$SUMMARY" | awk -F'|' '{gsub(/ /,"",$3); print $3}')
            FUNCS=$(echo "$SUMMARY" | awk -F'|' '{gsub(/ /,"",$4); print $4}')
            LINES=$(echo "$SUMMARY" | awk -F'|' '{gsub(/ /,"",$5); print $5}')
            echo "## MCP Server Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${STMTS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${BRANCH}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${FUNCS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | ${LINES}% |" >> $GITHUB_STEP_SUMMARY
          fi
          # Surface vitest's actual exit code as the step's exit code so
          # test failures fail the workflow (not the tee from the pipeline
          # above). Run AFTER the summary scraping so coverage still lands
          # in $GITHUB_STEP_SUMMARY on red builds.
          exit $TEST_EXIT

      - name: Smoke test compiled binary
        run: node mcp-server/dist/index.js < /dev/null

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mcp-server-coverage
          path: mcp-server/coverage/
          retention-days: 7
