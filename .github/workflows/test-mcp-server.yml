name: MCP Server Test Suite

permissions:
  contents: read

# Standalone workflow for the @gst/mcp-server workspace. Runs in parallel to
# the main Test Suite (test.yml) so MCP regressions are immediately
# attributable rather than commingled with site failures.
#
# Path filters (top-level) keep this workflow inert when changes don't affect
# the MCP surface — editing only Astro pages, components, or styles will not
# trigger this workflow. The trade-off vs the test.yml gate-job pattern: a
# skipped status is acceptable here because this workflow is NOT a required
# branch-protection check.
#
# A PR run skips its work when the push run already validated the same tree:
# `await_push` waits for an in-flight push run on the PR head, then `dedup`
# checks it passed and that the merge tree equals the head tree. Push runs
# never take this path, so the deploy chain (staging's workflow_run filter on
# `event == 'push'`, production's `await-mcp-test-run.sh` polling `event=push`)
# sees exactly what it saw before. DEVELOPER_TOOLING.md § Duplicate-run dedup.

on:
  push:
    # Includes 'dependabot/**' (like test.yml / npm-audit.yml, unlike the deploy
    # workflows) so Dependabot rebases — which arrive as `synchronize`, not
    # opened/reopened — still validate the MCP surface on the new head commit.
    # deploy-mcp-staging.yml / deploy-mcp-production.yml gate on their own branch
    # list (no 'dependabot/**'), so dependency bumps are tested but never auto-deployed.
    # 'docs/**' + 'chore/**' added 2026-07-15: GitHub "Update branch" pushes also
    # arrive as `synchronize`, so these families need push-trigger coverage or
    # updated PRs stall BLOCKED (observed on PR #316). Lockstep with test.yml.
    #
    # `master` in this list is load-bearing beyond CI: `scripts/await-mcp-test-run.sh`
    # gates every production deploy on a `?event=push` run for the exact SHA, so
    # dropping it here would fail the pre-flight on every merge.
    # `tests/integration/workflow-chain-integrity.test.ts` (assertion B) asserts both
    # halves — master here, and `event=push` there. It reads this list TRIGGER-SCOPED,
    # because the `pull_request` block below also carries `branches: [master]` and a
    # union would stay green after master was dropped from exactly this list.
    branches: [master, 'feat/**', 'fix/**', 'feature/**', 'dependabot/**', 'docs/**', 'chore/**']
    paths:
      - 'mcp-server/**'
      - '!mcp-server/**/*.md'
      # Website modules the Worker VALUE-imports at runtime. Globs, not an
      # enumeration: the hand-maintained list drifted twice (BL-109 found
      # radar-url.ts missing since it was introduced, and would have added three
      # more one-by-one). A PR touching only an unlisted file runs ZERO mcp tests,
      # so the guard is absent on exactly the change it exists to catch — and the
      # gap is invisible because a workflow that never fires reports nothing.
      #
      # Consequence: a website-only edit under these globs now runs the MCP suite and
      # (on master) a no-op staging redeploy. Expected, not a misfire — the alternative
      # is guessing which website edits reach the Worker bundle.
      # `deploy-mcp-production.yml` MUST carry the same list; asserted by
      # `tests/integration/workflow-paths-parity.test.ts`.
      - 'src/utils/**'
      - 'src/schemas/**'
      - 'src/data/common/**'
      - 'src/data/diligence-machine/**'
      - 'src/data/infrastructure-cost-governance/**'
      - 'src/data/irl/**'
      - 'src/data/ma-portfolio/projects.json'
      - 'src/lib/inoreader/types.ts'
      # Reached TRANSITIVELY, through website modules above: techpar-engine.ts
      # imports src/data/techpar/stages, filterLogic.ts imports src/types/portfolio.
      # `tests/integration/workflow-paths-parity.test.ts` walks the Worker's import
      # graph and fails if any file it reaches is outside this list. Codegen inputs
      # (src/data/regulatory-map/**, src/data/library/**) are deliberately absent:
      # they feed tracked generated files under mcp-server/, and the `test:docs`
      # bundle-freshness guard forces a regenerate that touches mcp-server/**.
      - 'src/data/techpar/**'
      - 'src/types/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-mcp-server.yml'
  pull_request:
    branches: [master]
    # Deliberately NOT listening to `synchronize` — push covers every commit
    # added to a PR'd branch, and `synchronize` would duplicate-fire on every
    # PR sync. `opened` + `reopened` still gives one PR-context run on the
    # synthetic merge SHA so the merge result is independently validated.
    types: [opened, reopened]
    paths:
      - 'mcp-server/**'
      - '!mcp-server/**/*.md'
      # Website modules the Worker VALUE-imports at runtime. Globs, not an
      # enumeration: the hand-maintained list drifted twice (BL-109 found
      # radar-url.ts missing since it was introduced, and would have added three
      # more one-by-one). A PR touching only an unlisted file runs ZERO mcp tests,
      # so the guard is absent on exactly the change it exists to catch — and the
      # gap is invisible because a workflow that never fires reports nothing.
      - 'src/utils/**'
      - 'src/schemas/**'
      - 'src/data/common/**'
      - 'src/data/diligence-machine/**'
      - 'src/data/infrastructure-cost-governance/**'
      - 'src/data/irl/**'
      - 'src/data/ma-portfolio/projects.json'
      - 'src/lib/inoreader/types.ts'
      # Reached TRANSITIVELY, through website modules above: techpar-engine.ts
      # imports src/data/techpar/stages, filterLogic.ts imports src/types/portfolio.
      # `tests/integration/workflow-paths-parity.test.ts` walks the Worker's import
      # graph and fails if any file it reaches is outside this list. Codegen inputs
      # (src/data/regulatory-map/**, src/data/library/**) are deliberately absent:
      # they feed tracked generated files under mcp-server/, and the `test:docs`
      # bundle-freshness guard forces a regenerate that touches mcp-server/**.
      - 'src/data/techpar/**'
      - 'src/types/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-mcp-server.yml'

concurrency:
  # Distinct group from test.yml so the two workflows run truly in parallel.
  # event_name in the key prevents push/PR cross-cancellation on the same ref.
  #
  # cancel-in-progress: true interacts with deploy-mcp-staging.yml's
  # workflow_run consumer correctly: if two pushes arrive ~simultaneously,
  # the in-progress test run is cancelled (status: cancelled, not success).
  # The downstream deploy workflow's `if: workflow_run.conclusion == 'success'`
  # filter then correctly suppresses the cancelled run's deploy chain, while
  # the winning push's deploy proceeds. Verified empirically 2026-05-31.
  group: mcp-server-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    # 30, not 10: a PR run may wait up to MAX_AGE_S (15 min) for the push run,
    # then do up to 10 min of real work if that push run did not pass.
    timeout-minutes: 30
    # Restates contents: read (a job-level block replaces the workflow-level
    # one) and adds actions: read for the runs queries below. The queries work
    # without it on this public repo today, but the dedup fails safe, so a
    # visibility change would silently turn it off rather than go red.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - id: await_push
        # A PR opened while the push run is still validating the same head
        # commit waits for it rather than repeating it. Advisory: always
        # exits 0, capped by the push run's age. See the script header.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: test-mcp-server.yml
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_AGE_S: '900'
        run: bash scripts/await-push-run.sh

      - id: dedup
        # skip=true only when a push run of this workflow PASSED on the PR
        # head commit AND this run's merge tree equals that commit's tree
        # (master has not moved under the PR). Anything else, including an
        # API error, leaves skip unset and the full suite runs.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PASSED=$(gh api "repos/${{ github.repository }}/actions/workflows/test-mcp-server.yml/runs?head_sha=${HEAD_SHA}&event=push&status=success&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
          HEAD_TREE=$(gh api "repos/${{ github.repository }}/git/commits/${HEAD_SHA}" --jq '.tree.sha' 2>/dev/null || echo "")
          MERGE_TREE=$(git rev-parse 'HEAD^{tree}')
          echo "passed push runs on ${HEAD_SHA}: ${PASSED}; head tree ${HEAD_TREE:-?}; merge tree ${MERGE_TREE}"
          if [ "$PASSED" != "0" ] && [ "$PASSED" -eq "$PASSED" ] 2>/dev/null && [ -n "$HEAD_TREE" ] && [ "$HEAD_TREE" = "$MERGE_TREE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The push run already validated this tree; skipping the repeat."
          fi

      - name: Setup Node.js
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache node_modules
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/cache@v6
        id: nm-cache
        with:
          # `setup-node`'s `cache: 'npm'` only caches the ~/.npm tarball
          # cache — `npm ci` still does the link/install pass (~30-40s).
          # Caching node_modules directly skips that step on cache hit.
          # Key includes lockfile + node version + a manual epoch we can
          # bump when we want to force a fresh install.
          path: |
            node_modules
            mcp-server/node_modules
          key: nm-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.dedup.outputs.skip != 'true' && steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        if: steps.dedup.outputs.skip != 'true'
        run: npm -w @gst/mcp-server run typecheck

      - name: Build
        if: steps.dedup.outputs.skip != 'true'
        run: npm -w @gst/mcp-server run build

      - name: Run tests with coverage
        # Capture vitest's exit code via PIPESTATUS so the step's success
        # reflects test outcomes, not just tee's. Without this the `tee`
        # pipeline captures tee's exit code (always 0), masking vitest
        # failures and making the workflow report `success` while tests
        # are red. Surfaced 2026-05-27 by an audit of why the Ivy /
        # Valorem / Commodore portfolio merges shipped to master with 2
        # failing tests — CI reported green; failures only became visible
        # to the next contributor running `npm test` locally and got
        # dismissed as "pre-existing master debt." Both this workflow and
        # test.yml had the same bug; both fixed in the same commit.
        #
        # PIPESTATUS[0] is bash-specific — `shell: bash` is required.
        if: steps.dedup.outputs.skip != 'true'
        shell: bash
        run: |
          npm -w @gst/mcp-server run test -- --coverage 2>&1 | tee coverage-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          SUMMARY=$(grep "^All files" coverage-output.txt || echo "")
          if [ -n "$SUMMARY" ]; then
            STMTS=$(echo "$SUMMARY" | awk -F'|' '{gsub(/ /,"",$2); print $2}')
            BRANCH=$(echo "$SUMMARY" | awk -F'|' '{gsub(/ /,"",$3); print $3}')
            FUNCS=$(echo "$SUMMARY" | awk -F'|' '{gsub(/ /,"",$4); print $4}')
            LINES=$(echo "$SUMMARY" | awk -F'|' '{gsub(/ /,"",$5); print $5}')
            echo "## MCP Server Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${STMTS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${BRANCH}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${FUNCS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | ${LINES}% |" >> $GITHUB_STEP_SUMMARY
          fi
          # Surface vitest's actual exit code as the step's exit code so
          # test failures fail the workflow (not the tee from the pipeline
          # above). Run AFTER the summary scraping so coverage still lands
          # in $GITHUB_STEP_SUMMARY on red builds.
          exit $TEST_EXIT

      - name: Smoke test compiled binary
        if: steps.dedup.outputs.skip != 'true'
        run: node mcp-server/dist/index.js < /dev/null

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        # always() keeps the upload on red runs; the dedup guard is combined
        # with it, never in place of it.
        if: always() && steps.dedup.outputs.skip != 'true'
        with:
          name: mcp-server-coverage
          path: mcp-server/coverage/
          retention-days: 7

      - name: Skipped (duplicate of the push run)
        if: steps.dedup.outputs.skip == 'true'
        run: echo "The push run of this workflow already passed on this tree; nothing to repeat."
