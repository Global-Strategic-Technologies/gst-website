name: Deploy MCP Worker — production

# BL-037 Phase B — automated production deploy on merge to master.
#
# Gating: triggers on push to master AFTER the staging deploy chain has
# proven the same commit (Phase A handles that — see deploy-mcp-staging.yml).
# Note we use `push` directly, NOT `workflow_run` chained off the staging
# deploy, because:
#   1. We want production to fire even if staging is briefly red (e.g., a
#      transient Cloudflare propagation timeout on the staging probe) — the
#      production probe is independent.
#   2. The `mcp-production` GitHub Environment gates the deploy with a
#      required-reviewer approval, so a fully autonomous chain isn't the
#      intended UX anyway. Operator review is the production gate.
#
# BL-111 re-examined chaining off the TEST SUITE (not staging) and rejected it
# too — the reasons are different from the two above, so they are recorded here
# rather than re-derived from "staging does it, why not production":
#   3. FORK TRUST. `test-mcp-server.yml` fires on `pull_request`, including from
#      forks. A `workflow_run` consumer runs in the BASE repo with repository
#      secrets in scope, so chaining production off it would put a fork PR one
#      maintainer click ("approve and run workflows") away from a secret-bearing
#      production deploy. Fixing a 75-second race by widening the production
#      trust boundary is a bad trade. See deploy-mcp-staging.yml's job `if`.
#   4. LOUD -> SILENT. A broken guard here is a red run plus an auto-opened
#      incident Issue. A mis-wired `workflow_run` produces NOTHING — no run, no
#      Issue, production silently drifting behind master. That is the failure
#      class that once left production a month behind.
#   5. `workflows: ['MCP Server Test Suite']` is a literal string match against
#      that workflow's `name:`. A rename breaks the chain silently, and nothing
#      asserts the two agree.
#
# Reviewer gate: GitHub Settings → Environments → `mcp-production` must be
# configured with Required reviewers ≥ 1 BEFORE this workflow can deploy.
# Without the environment configured, the job will fail at job-start with a
# clear "no environment found" error.

on:
  push:
    branches: [master]
    # Paths MIRROR `test-mcp-server.yml`. The invariant is a subset relation — prod
    # may deploy on less than is tested, never on more — and it is asserted by
    # `tests/integration/workflow-paths-parity.test.ts`. The production
    # deploy must never fire on a commit the MCP test suite did not also run
    # on (audit gap #7, 2026-05-31): originally the prod workflow's paths
    # included its own filename so the workflow could "self-validate on
    # creation" — but the upstream MCP test suite did NOT include the prod
    # workflow filename in its paths, so a commit touching only the prod
    # workflow file would deploy production with no MCP test on that SHA.
    # Resolved by mirroring the upstream paths exactly. Edits to this
    # workflow file itself now go via `workflow_dispatch` for ad-hoc verify.
    paths:
      - 'mcp-server/**'
      - '!mcp-server/**/*.md'
      # Website modules the Worker VALUE-imports at runtime. Globs, not an
      # enumeration — see the identical block in `test-mcp-server.yml` for why.
      # BL-109 widened that list and MUST widen this one in lockstep: leaving prod
      # narrow would let a master merge touching only e.g. `src/utils/techpar-engine.ts`
      # run the MCP suite, go green, auto-deploy STAGING via the workflow_run chain —
      # and never fire production, leaving the two environments silently divergent on
      # Worker runtime code. `tests/integration/workflow-paths-parity.test.ts` asserts
      # the subset relation so the next drift is loud.
      #
      # Consequence accepted: a website-only `src/utils/**` edit now queues a production
      # Worker deploy. It waits on the `mcp-production` environment approval like any
      # other, and a no-op redeploy is cheaper than an undetected divergence.
      - 'src/utils/**'
      - 'src/schemas/**'
      - 'src/data/common/**'
      - 'src/data/diligence-machine/**'
      - 'src/data/infrastructure-cost-governance/**'
      - 'src/data/irl/**'
      - 'src/data/ma-portfolio/projects.json'
      - 'src/lib/inoreader/types.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-mcp-server.yml'
  workflow_dispatch:
    # Manual trigger for re-deploys (e.g., after fixing a smoke-probe failure
    # without changing source). Same reviewer gate applies via the environment.

permissions:
  contents: read
  # `issues: write` is required by the failure-notification step (audit
  # gap #10) so the workflow can open an incident issue when a deploy
  # fails. Scoped to issues only; the rest of the workflow runs with
  # read-only contents.
  issues: write

concurrency:
  # Single global group: production only deploys from master (enforced via
  # the `if: github.ref == 'refs/heads/master'` job guard), so a
  # branch-keyed group would never collide. The static key makes the
  # serialization semantic explicit.
  #
  # cancel-in-progress: true — LATEST-WINS. `wrangler deploy` publishes the
  # WHOLE Worker at a commit (not incremental), so deploying the newest SHA
  # inherently includes every prior merge; there is never a reason to deploy
  # a stale SHA once a newer one exists. When a new push arrives, it cancels
  # the older un-deployed run and carries the approval flag itself — so an
  # operator only ever has to approve the LATEST run, and approving it ships
  # everything.
  #
  # Why NOT `false` (the original setting): a run parked in the environment
  # approval `waiting` state STILL occupies the group. With `false`, one
  # un-approved run head-of-line-blocks every later run indefinitely — the
  # exact failure that left production a month behind (a June-03 run sat
  # `waiting` and queued all subsequent deploys, including a radar hotfix,
  # behind it). `true` makes the newest deploy independent of older ones.
  #
  # The one tradeoff `true` accepts: if two deploys land within the ~1-2 min
  # deploy window, the newer may cancel an in-flight `wrangler deploy`. This
  # is safe because (a) Cloudflare version publishes are atomic — an
  # interrupted upload doesn't half-publish, it just doesn't flip the route;
  # (b) the cancelling run immediately redeploys the newer SHA; and (c) the
  # smoke probe below verifies /health.gitSha matches before the run is
  # green. Net: a brief indeterminate window the superseding deploy resolves.
  group: deploy-mcp-production
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy MCP Worker to production
    runs-on: ubuntu-latest
    # Defense vs. accidental wrong-ref push or workflow_dispatch from a
    # non-master ref (workflow_dispatch can run from any branch by default).
    if: github.ref == 'refs/heads/master'
    environment:
      name: mcp-production
      url: https://mcp.globalstrategic.tech/health
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify MCP Server Test Suite passed on this SHA
        # Defense vs. audit gap #7: the upstream `test-mcp-server.yml` paths
        # filter intentionally excludes its own workflow file changes. If it
        # didn't run on this SHA (e.g., a workflow-only commit), we have no
        # CI signal that the Worker source is safe to deploy. Query the
        # GitHub API for a successful MCP test run on this exact SHA before
        # proceeding. `workflow_dispatch` bypasses this check (operator
        # explicitly accountable for the re-deploy).
        #
        # BL-111: this used to be a SINGLE API query with no wait and no retry,
        # which treated "not yet" as "never". Both workflows fire on the same
        # push and start in the same second, so it raced the suite and lost —
        # twice in a row on unrelated commits, 74 s and 78 s early. It was
        # masked for months because approving `mcp-production` usually takes a
        # human longer than the ~2 min the suite needs.
        #
        # Now a bounded poll on an exact `head_sha` query. Exit codes and the
        # operator action for each are in the failure-Issue body below; the
        # script's header is the authority.
        if: github.event_name == 'push'
        # Bounds the poll independently of the script's own 300 s cap — defence
        # against a hang, not a second cap. That cap is WALL-CLOCK, deliberately:
        # a sleep accumulator plus 31 round trips can exceed 360 s under degraded
        # API latency, and the step would then be KILLED with no exit code at all
        # — in the one place an operator reads exit codes. The JOB budget stays at 10 min:
        # measured, the deploy tail is ~37 s (worst case ~2.5 min), so 5 + 2.5
        # fits with margin. Approval wait is excluded from timeout-minutes.
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: bash scripts/await-mcp-test-run.sh

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            mcp-server/node_modules
          key: nm-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Deploy MCP Worker to production
        working-directory: mcp-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run deploy:production

      - name: Smoke probe — /health gitSha matches deployed commit
        env:
          HOST: https://mcp.globalstrategic.tech
          EXPECTED_SHA: ${{ github.sha }}
        run: bash mcp-server/scripts/smoke-probe.sh

      - name: Open Issue on deploy failure
        # Audit gap #10: production deploy failures had no operator
        # notification path. Opens an Issue labeled `incident` +
        # `mcp-prod-deploy` with the run URL + SHA so the failure surfaces
        # in the GitHub Issues view rather than only in the Actions tab.
        if: failure() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          # BL-111 defect 3: `gh issue create --label` ERRORS on a label that does
          # not exist, so this step failed silently for its whole life — the repo
          # has one Issue (#96, 2026-04-19) despite repeated deploy failures, and
          # run 30975740442 shows `failure` on this very step. Pre-create the
          # labels; `--force` updates an existing label rather than erroring, so
          # this is idempotent. Same pattern and root cause as
          # prettier-drift-check.yml.
          #
          # TWO degradations, because this step must not be able to mute itself:
          #
          #   `|| echo ::warning::` — the default `run:` shell is `bash -e`, so a
          #   transient label failure would abort BEFORE `gh issue create` runs.
          #   The notification would go silent in exactly the case it exists to
          #   report on, which is the failure this whole defect is about.
          #
          #   `|| gh issue create` unlabeled — and if a label genuinely could not
          #   be ensured, filing without labels beats not filing. Routing is worth
          #   less than the operator learning production is broken.
          ensure_label() {
            gh label create "$1" --color "$2" --description "$3" --force \
              || echo "::warning::could not ensure label '$1'; the incident Issue may file unlabeled"
          }
          ensure_label incident b60205 "Production or recovery incident requiring operator action"
          ensure_label mcp-prod-deploy 1d76db "MCP Worker production deploy pipeline"

          TITLE="🚨 Production MCP deploy failed at ${DEPLOYED_SHA:0:7}"
          BODY="$(cat <<EOF
          **Workflow run**: $RUN_URL
          **SHA**: \`$DEPLOYED_SHA\`
          **Triggered by**: @${{ github.actor }}

          The production MCP deploy workflow failed. Most likely cause is one of:
          - \`wrangler deploy\` failure (Cloudflare API error, credential expiry)
          - Smoke probe gap (/health.gitSha didn't match within 70s)
          - Test-suite verification step — see the code table below

          **If the "Verify MCP Server Test Suite" step failed**, the runner logs
          \`Process completed with exit code N\` at the end of that step. Read N, then:

          | N | meaning | action |
          |---|---|---|
          | 1 | the suite ran and FAILED on this SHA | fix the failure. Do **not** deploy. |
          | 2 | script bug (bad/missing input) | read the step log; this is not a deploy problem |
          | 3 | a suite run was seen but never reached a verdict before the guard gave up | **re-run this deploy.** Do NOT workflow_dispatch |
          | 4 | no suite run ever appeared for this SHA | check whether the upstream paths filter legitimately skipped it. This is the **only** case where \`workflow_dispatch\` is right |
          | 5 | GitHub API unreachable throughout | dead token, revoked permission or outage. Re-running will not help — fix the credential |
          | 6 | API responded but no body was parseable | usually a transient proxy/interstitial. **Re-run first** |
          | *(none — step killed at 6 min)* | the poll's own 5 min cap is WALL-CLOCK, so it always fires first; reaching 6 min means the loop did not terminate | script bug; do not re-run, read the log |

          **Operator actions**:
          1. Open the run URL above and read the failing step's log.
          2. If \`wrangler deploy\` failed: deploy IS NOT on the Worker; re-run after fix.
          3. If smoke probe failed: deploy IS on the Worker but \`/health\` didn't reflect it. Check \`mcp.globalstrategic.tech/health\` manually; consider invoking the rollback workflow.
          4. If pre-deploy verification failed: read the exit code and use the table above. \`workflow_dispatch\` is correct for **code 4 only** — it deploys with NO test verification, so reaching for it on a code 3 (suite merely still running) reopens the very gap this guard exists to close.

          Close this Issue once the production state is verified clean.
          EOF
          )"

          gh issue create --title "$TITLE" --label "incident,mcp-prod-deploy" --body "$BODY" \
            || gh issue create --title "$TITLE" --body "$BODY"
