name: Deploy MCP Worker — staging

# BL-037 Phase A — automated staging deploy on green MCP test suite.
#
# Gating: TWO conditions, and both matter.
#
#   1. Path gating lives upstream in `test-mcp-server.yml` (see below).
#   2. The job `if:` additionally requires the triggering run to be a `push`
#      from THIS repository — BL-111 defect 2. Without it, a fork PR reaches a
#      secret-bearing deploy of attacker-controlled code. `branches:` below does
#      not close it: that filter matches the FORK's branch name. See the job
#      condition for the full reasoning.
#
# On path gating: this workflow has NO `paths:` filter of its own. Gating lives
# upstream in `.github/workflows/test-mcp-server.yml` (its `paths:` block
# already excludes website-only changes — Astro pages, components, styles).
# `workflow_run` does not honor consumer-side `paths:`, so adding one here
# would be a no-op. The chain is: a push lands → test-mcp-server.yml
# decides whether to run based on its paths filter → if it runs and
# succeeds, this workflow fires. Website-only changes never trigger the
# upstream workflow and so never reach this one.
#
# Deploy is delegated to `npm run deploy:staging` (mcp-server/scripts/
# deploy.mjs) — the same script operators run locally. This keeps the
# workflow thin and the build/upload-source-maps/Sentry-release wiring
# in one place.

on:
  workflow_run:
    workflows: ['MCP Server Test Suite']
    types: [completed]
    # Branch list harmonized with `test.yml` and `test-mcp-server.yml` — all
    # three workflows now share the canonical set so the chain is never
    # short-circuited by a filter mismatch (BL-037 follow-up after BL-038
    # surfaced two gaps: `feature-*` didn't match slash-style branches, and
    # `master` was missing so the merge commit never got staging validation).
    # `dev` retired 2026-05-31 (CLAUDE.md § Branch Strategy) — dropped BL-111.
    branches: [master, 'feat/**', 'fix/**', 'feature/**']

permissions:
  contents: read

concurrency:
  # Per-branch group: rapid successive merges to the same branch queue rather
  # than race. `cancel-in-progress: false` because mid-flight cancellation of
  # `wrangler deploy` could leave the Worker partially uploaded — for a
  # deploy workflow the queue-and-wait semantic is the correct safety
  # property, even though "only the latest matters" is intuitively appealing.
  group: deploy-mcp-staging-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    # BL-111 defect 2 — the two extra clauses are a SECURITY fix, not tidying.
    #
    # `test-mcp-server.yml` fires on `pull_request`, including from forks. A
    # `workflow_run` consumer runs in the BASE repo with CLOUDFLARE_API_TOKEN
    # and SENTRY_AUTH_TOKEN in scope, and `branches:` above matches the
    # TRIGGERING run's head_branch — which for a fork PR is the FORK's branch
    # name. So `branches:` alone does not keep fork content out.
    #
    # The realistic path is not a bypass, it is a maintainer doing the normal
    # thing: clicking "approve and run workflows" so a contribution's tests
    # execute. That click then reached this deploy. GitHub's control cannot
    # express "run the tests but do not deploy" — only this `if` can. And note
    # `npm ci` below runs the fork's lifecycle scripts with both tokens already
    # in the job env, so the exposure lands a step BEFORE the deploy.
    #
    #   event == 'push'                     excludes pull_request runs entirely,
    #                                       which is the only way fork content
    #                                       arrives (a push inside a fork runs in
    #                                       the fork's own Actions and emits no
    #                                       workflow_run here). It also stops
    #                                       staging deploying same-repo PR runs,
    #                                       which carry a synthetic merge SHA
    #                                       belonging to no branch.
    #   head_repository == github.repository  defence in depth if `event` is ever
    #                                       loosened.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          # Reuses the cache key shape from test.yml + test-mcp-server.yml so
          # a warm install from the upstream test run is reused here. Skips
          # ~30-40s of npm ci on hit.
          path: |
            node_modules
            mcp-server/node_modules
          key: nm-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Deploy MCP Worker to staging
        working-directory: mcp-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run deploy:staging

      - name: Smoke probe — /health gitSha matches deployed commit
        env:
          HOST: https://mcp-staging.globalstrategic.tech
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash mcp-server/scripts/smoke-probe.sh
