name: Docs link integrity

# Runs `npm run test:docs` — three guard files:
#   - `tests/integration/docs-link-integrity.test.ts` (BL-089): every relative
#     markdown link and load-bearing `#anchor` across both doc trees resolves,
#     so BL-088's distilled cross-references can't silently rot.
#   - `tests/integration/docs-variables-sync.test.ts`: VARIABLES_REFERENCE.md ↔
#     variables.css parity.
#   - `tests/integration/design-sync-guards.test.ts` (BL-135): the claude.ai/design
#     sync — names the `.design-sync/` docs use exist in src/styles, ROOTS
#     coverage, specimen typecheck, chrome slices resolve, README ceiling.
#   - `tests/integration/mcp-published-tool-count.test.ts`: the ten tool counts
#     published across ARCHITECTURE.md, BREAKING_CHANGES.md and the two
#     mcp-server READMEs — on three different bases (stdio registrations /
#     stdio minus the deprecated alias / remote Worker) — bound to what
#     `server.ts` and `tools/_local-only.ts` actually register. It lives here
#     rather than only in test.yml for the reason stated below: the numbers it
#     guards are IN markdown, so the commits that break them are docs-only.
# The authoritative list is `test:docs` in package.json; DEVELOPER_TOOLING.md
# describes each guard.
#
# WHY A DEDICATED WORKFLOW: `test.yml`'s `changes` gate deliberately SKIPS the
# unit/integration jobs on docs-only diffs — the exact case this guard must fire
# on. So it can't live only there. This workflow runs on EVERY PR (the guard is
# cheap, and it also covers code→doc `#anchor` citations that a code-only change
# could break) plus pushes to master. Default `pull_request` types include
# `synchronize`, so every push to a PR re-runs it (no push-branch-list gap).
#
# "Verify doc links" IS a required status check on the master ruleset
# (added by the operator 2026-07-19) — a broken doc link/anchor blocks merge.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docs-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-links:
    name: Verify doc links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            mcp-server/node_modules
          key: nm-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run documentation link & anchor guard
        run: npm run test:docs
