name: Lighthouse CI

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
    # NO workflow-level `paths-ignore` (removed 2026-09-26). A path-ignored
    # workflow never reports at all, so once `lighthouse` is a REQUIRED check it
    # would leave every docs-only PR waiting forever for a status that never
    # comes. The same skip now lives in the `changes` job below, which lets the
    # `lighthouse` job run its steps as skipped and still report success — the
    # house "dummy skip" pattern from test.yml.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running Lighthouse audit'
        required: false
        default: 'Manual performance audit'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Gate job. Skips Lighthouse on PRs that can't move a performance score —
  # docs, workflow files, and MCP-server-only changes (the BL-045/046 candidate
  # filing ran a full 5-min audit for zero signal). If EVERY changed path is in
  # the ignore set the audit is skipped; mixed PRs still run it. Manual
  # dispatches always run.
  # ─────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Performance-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # pull-requests: read lets dorny/paths-filter use the GitHub API on PR
    # events (no checkout needed), as in test.yml.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'every'
          list-files: json
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.github/**'
              - '!mcp-server/**'
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.code }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Log gate decision
        run: |
          echo "event=${{ github.event_name }}"
          echo "code=${{ steps.filter.outputs.code }}"
          echo "run=${{ steps.decide.outputs.run }}"
          echo "matched files: ${{ steps.filter.outputs.code_files }}"

  lighthouse:
    # The required-check context is this `name:` — keep it `lighthouse`; the
    # branch ruleset and DEVELOPER_TOOLING.md § PR requirements name it.
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # always(): if `changes` itself fails, a plain `needs` would SKIP this job,
    # and a skipped required check counts as passing. The first step turns
    # that into a failure instead.
    if: always()
    steps:
      - name: Require a successful change detection
        if: needs.changes.result != 'success'
        run: |
          echo "::error::The changes job did not succeed (${{ needs.changes.result }}), so Lighthouse cannot decide whether to run."
          exit 1

      - uses: actions/checkout@v7
        if: needs.changes.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.run == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
        if: needs.changes.outputs.run == 'true'

      # ── Desktop audit ──────────────────────────────────────
      # `continue-on-error` stays so the mobile audit and the summary still run
      # after a desktop failure; the `Enforce` step at the end is the gate.
      # `shell: bash` is load-bearing: it adds `-o pipefail`. GitHub's default
      # shell is `bash -e` WITHOUT pipefail, so `lhci … | tee` would report tee's
      # exit code and the step outcome would be `success` on a failed assertion.
      # No LHCI_GITHUB_APP_TOKEN: per-URL commit statuses would collide between
      # the desktop and mobile runs (same `lhci/url<path>` context) and can land
      # on a non-head SHA; `temporary-public-storage` needs no token.
      - name: Run Lighthouse CI (desktop)
        id: lhci_desktop
        if: needs.changes.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: npx lhci autorun --config=lighthouserc.cjs 2>&1 | tee lhci-output-desktop.txt

      - name: Save desktop scores
        if: always() && needs.changes.outputs.run == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            const output = fs.readFileSync('lhci-output-desktop.txt', 'utf8');
            const uploadLines = output.match(/Uploading median LHR.*?success!/g) || [];
            const reportLines = output.match(/Open the report at https:\/\/\S+/g) || [];
            const reportMap = {};
            for (let i = 0; i < uploadLines.length; i++) {
              const pageMatch = uploadLines[i].match(/http:\/\/localhost:4321(\/[^\s.]*)?/);
              const page = pageMatch && pageMatch[1] ? pageMatch[1] : '/';
              const urlMatch = reportLines[i]?.match(/(https:\/\/\S+)/);
              if (urlMatch) reportMap[page] = urlMatch[1];
            }

            const lhciDir = '.lighthouseci';
            const rows = [];
            if (fs.existsSync(lhciDir)) {
              const jsonFiles = fs.readdirSync(lhciDir)
                .filter(f => f.startsWith('lhr-') && f.endsWith('.json'))
                .sort();
              for (const file of jsonFiles) {
                try {
                  const data = JSON.parse(fs.readFileSync(path.join(lhciDir, file), 'utf8'));
                  const page = new URL(data.requestedUrl).pathname || '/';
                  const reportUrl = reportMap[page] || '';
                  const perf = Math.round((data.categories.performance?.score || 0) * 100);
                  const fcp = Math.round(data.audits['first-contentful-paint'].numericValue);
                  const lcp = Math.round(data.audits['largest-contentful-paint'].numericValue);
                  const tbt = Math.round(data.audits['total-blocking-time'].numericValue);
                  const cls = data.audits['cumulative-layout-shift'].numericValue.toFixed(3);
                  const icon = perf >= 90 ? '🟢' : perf >= 50 ? '🟠' : '🔴';
                  const link = reportUrl ? '[View](' + reportUrl + ')' : '—';
                  rows.push('| ' + icon + ' \`' + page + '\` | **' + perf + '** | ' + fcp + 'ms | ' + lcp + 'ms | ' + tbt + 'ms | ' + cls + ' | ' + link + ' |');
                } catch (e) { /* skip */ }
              }
            }
            fs.writeFileSync('/tmp/desktop-rows.json', JSON.stringify(rows));
          "

      # ── Mobile audit ───────────────────────────────────────
      - name: Clear desktop LHCI artifacts
        if: always() && needs.changes.outputs.run == 'true'
        run: rm -rf .lighthouseci

      # Same `continue-on-error` + `shell: bash` (pipefail) reasoning as desktop.
      - name: Run Lighthouse CI (mobile)
        id: lhci_mobile
        if: needs.changes.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: npx lhci autorun --config=lighthouserc.mobile.cjs 2>&1 | tee lhci-output-mobile.txt

      # ── Combined summary ───────────────────────────────────
      - name: Generate summary
        if: always() && needs.changes.outputs.run == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            // Read saved desktop rows
            let desktopRows = [];
            try { desktopRows = JSON.parse(fs.readFileSync('/tmp/desktop-rows.json', 'utf8')); } catch {}

            // Build mobile rows from current .lighthouseci
            const output = fs.existsSync('lhci-output-mobile.txt') ? fs.readFileSync('lhci-output-mobile.txt', 'utf8') : '';
            const uploadLines = output.match(/Uploading median LHR.*?success!/g) || [];
            const reportLines = output.match(/Open the report at https:\/\/\S+/g) || [];
            const reportMap = {};
            for (let i = 0; i < uploadLines.length; i++) {
              const pageMatch = uploadLines[i].match(/http:\/\/localhost:4321(\/[^\s.]*)?/);
              const page = pageMatch && pageMatch[1] ? pageMatch[1] : '/';
              const urlMatch = reportLines[i]?.match(/(https:\/\/\S+)/);
              if (urlMatch) reportMap[page] = urlMatch[1];
            }

            const mobileRows = [];
            const lhciDir = '.lighthouseci';
            if (fs.existsSync(lhciDir)) {
              const jsonFiles = fs.readdirSync(lhciDir)
                .filter(f => f.startsWith('lhr-') && f.endsWith('.json'))
                .sort();
              for (const file of jsonFiles) {
                try {
                  const data = JSON.parse(fs.readFileSync(path.join(lhciDir, file), 'utf8'));
                  const page = new URL(data.requestedUrl).pathname || '/';
                  const reportUrl = reportMap[page] || '';
                  const perf = Math.round((data.categories.performance?.score || 0) * 100);
                  const fcp = Math.round(data.audits['first-contentful-paint'].numericValue);
                  const lcp = Math.round(data.audits['largest-contentful-paint'].numericValue);
                  const tbt = Math.round(data.audits['total-blocking-time'].numericValue);
                  const cls = data.audits['cumulative-layout-shift'].numericValue.toFixed(3);
                  const icon = perf >= 90 ? '🟢' : perf >= 50 ? '🟠' : '🔴';
                  const link = reportUrl ? '[View](' + reportUrl + ')' : '—';
                  mobileRows.push('| ' + icon + ' \`' + page + '\` | **' + perf + '** | ' + fcp + 'ms | ' + lcp + 'ms | ' + tbt + 'ms | ' + cls + ' | ' + link + ' |');
                } catch (e) { /* skip */ }
              }
            }

            const header = '| Page | Performance | FCP | LCP | TBT | CLS | Report |\n|------|-------------|-----|-----|-----|-----|--------|';

            let summary = '## Lighthouse CI Scores\n\n<table><tr>\n<td valign=\"top\">\n\n';
            summary += '### 🖥️ Desktop\n\n';
            if (desktopRows.length > 0) {
              summary += header + '\n' + desktopRows.join('\n') + '\n';
            } else {
              summary += '⚠️ No desktop results\n';
            }
            summary += '\n</td>\n<td valign=\"top\">\n\n';
            summary += '### 📱 Mobile\n\n';
            if (mobileRows.length > 0) {
              summary += header + '\n' + mobileRows.join('\n') + '\n';
            } else {
              summary += '⚠️ No mobile results\n';
            }
            summary += '\n</td>\n</tr></table>\n';

            // Assertion results from both runs
            const assertionFiles = ['lhci-output-desktop.txt', 'lhci-output-mobile.txt'];
            const labels = ['Desktop', 'Mobile'];
            for (let i = 0; i < assertionFiles.length; i++) {
              if (!fs.existsSync(assertionFiles[i])) continue;
              const text = fs.readFileSync(assertionFiles[i], 'utf8');
              const assertions = text.split('\n')
                .filter(l => /result\(s\) for|warning for|failure for/.test(l))
                .map(l => l.replace(/\x1b\[[0-9;]*m/g, ''))
                .join('\n');
              if (assertions) {
                summary += '\n### ' + labels[i] + ' Assertions\n\n\`\`\`\n' + assertions + '\n\`\`\`\n';
              }
            }

            if (!summary.includes('Assertions')) {
              summary += '\n✅ All performance assertions passed\n';
            }

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          "

      # ── Gate ───────────────────────────────────────────────
      # The audits above are `continue-on-error` so both presets and the summary
      # always run; THIS step turns a failed audit into a failed check. Only
      # `error`-level assertions fail `lhci autorun` — in both configs that is
      # CLS alone (max 0.1); FCP/LCP/TBT/TTI are `warn`. A failed UPLOAD only
      # warns (autorun.js, failOnUploadFailure unset), so it cannot block. A
      # healthcheck or collect failure (Chrome or dev-server startup) does fail
      # the step. That's deliberate: a gate that couldn't measure must not pass,
      # and a re-run is the remedy.
      - name: Enforce Lighthouse assertions
        if: always() && needs.changes.outputs.run == 'true'
        run: |
          echo "desktop=${{ steps.lhci_desktop.outcome }} mobile=${{ steps.lhci_mobile.outcome }}"
          if [ "${{ steps.lhci_desktop.outcome }}" = "failure" ] || [ "${{ steps.lhci_mobile.outcome }}" = "failure" ]; then
            echo "::error::Lighthouse assertions failed — see the desktop/mobile assertion output in the job summary."
            exit 1
          fi

      - name: Skipped (no performance-relevant changes)
        if: needs.changes.outputs.run != 'true'
        run: echo "Skipped — this PR only touches docs, workflows, or mcp-server/."
