name: Cross-Browser E2E Tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running cross-browser tests'
        required: false
        default: 'Manual verification'

concurrency:
  group: cross-browser-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e-cross-browser:
    name: E2E Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    # Point /hub/radar at the offline radar stub (scripts/radar-stub.mjs,
    # started below) so the Radar content E2E runs in CI instead of skipping on
    # the empty state. Playwright's webServer inherits process.env and the page
    # is SSR, so `astro:env` reads these per request. The bearer is a
    # placeholder: the stub never checks it; RadarFeed only needs it non-empty
    # to reach the fetch. Values match RADAR.md § Working Offline.
    env:
      MCP_RADAR_SNAPSHOT_URL: http://127.0.0.1:8787/radar/snapshot
      MCP_KEY_WEBSITE_RADAR: stub-bearer-not-a-real-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Build application
        run: npm run build

      - name: Start radar snapshot stub
        run: |
          nohup node scripts/radar-stub.mjs > radar-stub.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "$MCP_RADAR_SNAPSHOT_URL" > /dev/null; then
              echo "radar stub ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::radar stub did not answer on $MCP_RADAR_SNAPSHOT_URL within 30s"
          cat radar-stub.log
          exit 1

      - name: Run E2E tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
