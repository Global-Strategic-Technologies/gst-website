# Cloudflare Worker config for the GST MCP server (BL-032).
#
# Two Worker environments: [env.staging] → gst-mcp-staging and
# [env.production] → gst-mcp. The top-level block is what `wrangler dev`
# uses without --env.
#
# Architecture & rationale: mcp-server/src/docs/ARCHITECTURE.md
#
# To run locally:
#   npm run dev:worker          # wrangler dev --env staging
#
# Deploys are CI-only: .github/workflows/deploy-mcp-staging.yml (after a
# green MCP test run), deploy-mcp-production.yml (push to master, behind the
# mcp-production approval) and rollback-mcp.yml. The `deploy:*` npm scripts
# are break-glass only. Runbook: src/docs/operations/DEPLOY.md.

name = "gst-mcp"
main = "src/worker.ts"
compatibility_date = "2026-05-01"
# global_fetch_strictly_public (BL-033 Slice 2): SSRF defense for CIMD —
# the OAuth provider fetches arbitrary client-supplied metadata-document
# URLs (client_id-as-URL), and this flag confines `fetch` to strictly
# public hosts so a malicious client_id cannot probe internal addresses.
# Our own outbound fetches (Upstash REST, Inoreader, Sentry) are all
# public hosts — no functional impact.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Emit source maps alongside the bundled Worker so deploy.mjs can ship them
# to Sentry via sentry-cli (Sentry → Cloudflare integration). Without this,
# Sentry stack traces show minified output (`dist/index.js:1:482718`); with
# it, traces resolve back to original TypeScript file:line. Source maps land
# in the `dist/` directory after `wrangler deploy --outdir dist
# --upload-source-maps` runs. Source-map upload itself is opt-in via
# SENTRY_AUTH_TOKEN in the deploy env; deploy.mjs warns + continues if
# missing so the chain doesn't break when the token isn't bound.
upload_source_maps = true

# Local dev + the `unstable_dev` test harness only (never read on deploy).
# With `--env staging` wrangler infers the upstream host from the staging
# route; this makes the Worker see that host over https, as it does when
# deployed, instead of http — so `url.origin` equals the staging
# PUBLIC_ORIGIN (ADR-0044) and the OAuth library's https-only resource rule
# holds under test and under `npm run dev:worker`.
#
# There is deliberately NO top-level `[vars] PUBLIC_ORIGIN`: plain
# `wrangler dev` (no --env) has no route to infer a host from, so the OAuth
# surface is off there (404) and only static keys authenticate. Use
# `npm run dev:worker` to exercise OAuth locally.
[dev]
upstream_protocol = "https"

# ---------------------------------------------------------------------------
# Analytics Engine — typed-metric emission (BL-032.75 Phase 1)
# ---------------------------------------------------------------------------
# Every Tool / Resource / Prompt invocation writes one event to AE via
# `env.METRICS.writeDataPoint(...)`. The bound dataset is the substrate
# Phase 3 Grafana dashboards SQL against.
#
# AE works on the Workers Free plan (verified 2026-05-27 against
# https://developers.cloudflare.com/analytics/analytics-engine/pricing/):
#   - Free:  100k writes/day + 10k reads/day + 3-month retention
#   - Paid:  10M writes/mo + 1M reads/mo, then $0.25/M writes
#
# Column map (positional blobs + doubles + 1 index) is pinned by
# `BLOB_SLOTS` / `DOUBLE_SLOTS` in `src/metrics/_schema.ts` and snapshot-tested. Substrate caps enforced
# by `src/metrics/guard.ts` at runtime.
#
# Top-level binding is for `wrangler dev` runs (un-tagged dataset).
# Env-specific overrides below scope events per environment so staging
# traffic doesn't contaminate production dashboards.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "mcp_events_dev"

# ---------------------------------------------------------------------------
# Workers KV — OAuth token/grant/client storage (BL-033 Slice 2)
# ---------------------------------------------------------------------------
# Substrate for @cloudflare/workers-oauth-provider: token/secret HASHES,
# grants (props encrypted with the token as key material), pre-registered
# client records, plus our own `mcp:oauth:m2m-client:*` records and
# one-shot consent/jti nonces. Distinct from the Upstash MCP DB — the
# library requires KV, and splitting auth state across two stores would
# be worse than the single-substrate deviation (recorded at BL-033
# AC:244 + ADR-0008). Reviewed under BL-154 → ADR-0036: the M2M client
# record stays here; the indexes it lacks live in Upstash beside it.
#
# Top-level binding (staging namespace id) exists for `wrangler dev` runs;
# local dev/miniflare simulates KV and never touches the remote namespace.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "580b8f1f9067410b93d6f1faa3edfed0"

# ---------------------------------------------------------------------------
# Compliance audit log — DEACTIVATED 2026-08-08 (ADR-0014); R2 binding retained
# ---------------------------------------------------------------------------
# The BL-033 Slice 3a pipeline (AUDIT_QUEUE producer → queue consumer in
# src/audit/consumer.ts → hash-chained immutable AUDIT_R2 objects) is unbound
# in ALL envs: no client consumes the audit product and the seqOf ledger was
# growing the Upstash free tier without bound. The queue producer/consumer
# blocks are removed; the producer gate in handle-authenticated.ts sees
# `env.AUDIT_QUEUE === undefined` and audit becomes a no-op. The Cloudflare
# queue resources (audit-log-{dev,staging,production} + their DLQs) and the
# R2 buckets are RETAINED — do not garbage-collect them; the re-enable
# procedure depends on them existing. Re-enable = revert this wrangler.toml
# hunk + src/docs/operations/AUDIT_LOG.md § Re-enable procedure.
[[r2_buckets]]
binding = "AUDIT_R2"
bucket_name = "gst-mcp-audit-dev"

# ---------------------------------------------------------------------------
# Cloudflare Workers Observability — persistent logs + traces (BL-032.77)
# ---------------------------------------------------------------------------
# Native Workers Logs + Workers Traces. Configured here so every deploy
# enables them automatically — no more toggling via the Cloudflare dashboard
# on each environment after a redeploy.
#
# Use cases (separate from BL-032.75 Phase 1 Analytics Engine emission):
#   - Workers Logs: searchable request/invocation logs with 3-day retention
#     on Free plan (200k events/day) — primary surface for diagnosing the
#     BL-032.77 Sentry-envelope failure modes without leaning on Sentry's
#     own ingest. Our `safeLog` lines (including the new `sentry.envelope.
#     post.{non-2xx,aborted,network-error}` instrumentation) land here.
#   - Workers Traces: per-invocation execution timeline. Useful for
#     correlating cron-firing duration with `ok` check-in timing —
#     direct evidence for or against the "isolate eviction mid-firing"
#     hypothesis in BL-032.77 Issue B.
#
# The top-level `enabled = false` is the deprecated all-or-nothing flag;
# the modern per-feature `logs.enabled` / `traces.enabled` flags below are
# the granular controls. Cloudflare's wrangler reader honors both —
# verified empirically 2026-05-29 by inspecting actual Workers Logs +
# Traces output from the production deploy (cron.radar-refresh.success
# events + `dataset: otel` span entries both present and operator-queryable
# via dash.cloudflare.com → Workers & Pages → gst-mcp → Logs / Traces).
#
# Inheritance: top-level observability applies to all envs by default.
# No per-env override needed; staging + production both pick this up.
[observability]
enabled = false
head_sampling_rate = 1
logs = { enabled = true, head_sampling_rate = 1, persist = true, invocation_logs = true }
traces = { enabled = true, persist = true, head_sampling_rate = 1 }

# nodejs_compat is required by OUR OWN Worker code, which imports Node
# built-ins directly:
#   - node:crypto  — src/schemas/compose-dossier-envelope.ts and
#                    src/prompts/irl-ingestion.ts (createHash)
#   - node:process — src/config.ts
# Cloudflare's nodejs_compat layer provides these on the Worker runtime.
#
# The reason changed in 0.69.0 (ADR-0045); the flag did not. Until then it was
# attributed to Cloudflare's `agents` package: its stateless MCP handler
# imported node:async_hooks, and it pulled `mimetext` (node:os) and
# `mime-types` (node:path) transitively. That package is no longer a
# dependency. The MCP SDK's `createMcpHandler`, which the Worker now calls
# directly, imports no node: module on the Worker path.
#
# This comment used to say our own code "stays Web-API-only". It does not, as
# the list above shows — do not retire the flag on that belief.
#
# Local-only tools/resources that use node:fs live in src/tools/_local-only.ts
# and are registered only by the stdio entrypoint (src/index.ts), never by
# this Worker. See BL-032 Q12.

# ---------------------------------------------------------------------------
# Staging
# ---------------------------------------------------------------------------
# Secrets are set per environment with `wrangler secret put <NAME> --env <env>`
# (each put deploys a new Worker version immediately). They are deliberately
# NOT listed here — a copy in this file drifts. The authoritative inventory
# (which secret lives in which environment, and why) is
# (repo root) src/docs/operations/SECRETS_INVENTORY.md; the typed bindings the code
# reads live in the `Env` interface in src/env.ts.

[env.staging]
name = "gst-mcp-staging"
routes = [
  { pattern = "mcp-staging.globalstrategic.tech", custom_domain = true }
]

# Environment discriminator — BL-041 follow-up. Prepended to per-deploy
# Upstash state keys (e.g. `mcp:acl-selfcheck:result:<env>:<gitSha>`) so
# both envs sharing the same MCP DB don't collide on shared keys. Kept
# under `[env.<name>.vars]` rather than as a secret because it's
# non-sensitive routing metadata.
[env.staging.vars]
ENV_NAME = "staging"
# The Worker's public origin (ADR-0044) — the one origin the OAuth surface
# answers on and every token credential is honoured on; see
# src/oauth/public-origin.ts. Per environment: wrangler does not inherit
# vars into named environments, and unbound means the OAuth surface is off.
PUBLIC_ORIGIN = "https://mcp-staging.globalstrategic.tech"
# BL-155 Slice 2 — hostnames a Turnstile siteverify response must name for
# the trial mint to accept it (exact, or `.suffix`). Staging accepts the
# website's hosts, localhost, and any Vercel preview so the signup page can
# be exercised before it ships. `example.com` is what the always-pass TEST
# secret reports as `hostname` (observed 2026-09-07; it reports no `action`,
# which `verifyTurnstile` waives only for a flagged testing-key response).
# Never add `example.com` to production.
TURNSTILE_EXPECTED_HOSTNAMES = "globalstrategic.tech,www.globalstrategic.tech,localhost,.vercel.app,example.com"
# BL-155 Slice 2 — extra browser origins the trial endpoint's CORS accepts on
# STAGING ONLY (ignored elsewhere by `parseExtraOrigins`). Exact origins, or
# one-label suffix patterns `https://*-<team>.vercel.app`; a bare
# `*.vercel.app` is rejected at parse. The team slug (`thefastcats-projects`)
# was read off the Vercel team record 2026-09-07 (Slice 3): preview hosts are
# `gst-website-<…>-thefastcats-projects.vercel.app`.
TRIAL_EXTRA_ORIGINS = "http://localhost:4321,https://*-thefastcats-projects.vercel.app"

# Analytics Engine — staging dataset (BL-032.75 Phase 1).
# Separate dataset from production so staging soak traffic doesn't
# pollute production dashboards.
[[env.staging.analytics_engine_datasets]]
binding = "METRICS"
dataset = "mcp_events_staging"

# OAuth KV — staging namespace (BL-033 Slice 2; created 2026-07-24 via
# `wrangler kv namespace create OAUTH_KV --env staging`).
[[env.staging.kv_namespaces]]
binding = "OAUTH_KV"
id = "580b8f1f9067410b93d6f1faa3edfed0"

# Compliance audit log — DEACTIVATED 2026-08-08 (ADR-0014). Queue producer/
# consumer blocks removed (see the top-level audit comment); the provisioned
# audit-log-staging queue + its DLQ are RETAINED for re-enable. R2 binding
# stays (bucket holds the immutable historical chain under Bucket Lock).
[[env.staging.r2_buckets]]
binding = "AUDIT_R2"
bucket_name = "gst-mcp-audit-staging"

# Staging deliberately has NO cron trigger.
#
# Staging exists to validate code changes, not to keep caches warm.
# Both envs share the same Inoreader OAuth app (single registered
# application; same credentials mirrored across envs), so a staging
# cron firing on the same `0 */6 * * *` cadence as production
# DOUBLED the Zone-1 budget burn against the shared 100/day cap.
# Discovered Day 2 of the BL-032.8 Phase B soak (2026-05-18) when
# the `mcp:inoreader:day-counter:YYYY-MM-DD` reached 36 at 12:30 UTC
# instead of the expected 18 (3 prod firings × 6 calls).
#
# Cron-path validation now lives in:
#   - `mcp-server/tests/integration/cron-proactive-refresh.test.ts`
#   - Manual `wrangler dev --env staging` runs ad-hoc
#   - Occasional manual `wrangler tail --env staging` of the
#     scheduled handler triggered via Cloudflare dashboard "Trigger"
#
# If you re-enable the staging cron in the future, FIRST confirm
# the staging Inoreader credentials point at a different registered
# OAuth app from production — otherwise this regression returns.

# ---------------------------------------------------------------------------
# Production
# ---------------------------------------------------------------------------
# Same secret matrix as staging (with `--env production` values). Single
# MCP DB binding: UPSTASH_MCP_REST_TOKEN = Standard read-write token for
# the gst-mcp Upstash database. The legacy UPSTASH_INOREADER_REST_*
# bindings (read-only access to the website-shared `gst-radar-tokens`
# DB) were retired in BL-032.8 Phase B (PR #140, 2026-05-27); the
# database itself was decommissioned in the same operator batch.

[env.production]
name = "gst-mcp"
routes = [
  { pattern = "mcp.globalstrategic.tech", custom_domain = true },
  # BL-033 Slice 4 — dedicated status subdomain. custom_domain auto-provisions
  # the DNS record + edge cert on deploy (the zone is already on Cloudflare).
  # worker.ts serves the status page at this subdomain's root (`/`).
  { pattern = "status.mcp.globalstrategic.tech", custom_domain = true },
  # ADR-0023 — documentation alias. The public capability reference lives at
  # globalstrategic.tech/hub/mcp/docs/; this host exists so the name BL-093
  # planned for a docs site still resolves, and worker.ts 308s every path on it
  # to that page. No staging counterpart: staging carries a single route, same
  # as the status subdomain, so this alias is first exercised in production.
  { pattern = "docs.mcp.globalstrategic.tech", custom_domain = true }
]

# Environment discriminator — see staging block for rationale.
[env.production.vars]
ENV_NAME = "production"
# ADR-0044 — see the staging block. The status/docs alias hostnames above
# are deliberately NOT OAuth origins.
PUBLIC_ORIGIN = "https://mcp.globalstrategic.tech"
# BL-155 Slice 2 — see the staging block. Production accepts only the
# website's own hosts; no TRIAL_EXTRA_ORIGINS here by design.
TURNSTILE_EXPECTED_HOSTNAMES = "globalstrategic.tech,www.globalstrategic.tech"

# Analytics Engine — production dataset (BL-032.75 Phase 1).
# Canonical dataset for Phase 3 Grafana dashboards + the `/status` page
# server-side query.
[[env.production.analytics_engine_datasets]]
binding = "METRICS"
dataset = "mcp_events"

# OAuth KV — production namespace (BL-033 Slice 2; created 2026-07-24 via
# `wrangler kv namespace create OAUTH_KV --env production`).
[[env.production.kv_namespaces]]
binding = "OAUTH_KV"
id = "13c9e9f590244408ab7fe8cdf650766d"

# Compliance audit log — DEACTIVATED 2026-08-08 (ADR-0014). Queue producer/
# consumer blocks removed (see the top-level audit comment); the provisioned
# audit-log-production queue + its DLQ are RETAINED for re-enable. R2 binding
# stays (bucket holds the immutable historical chain under the 7yr SEC 17a-4
# Bucket Lock).
[[env.production.r2_buckets]]
binding = "AUDIT_R2"
bucket_name = "gst-mcp-audit-production"

# Radar snapshot refresh — cadence calibrated to cache TTL.
#
# The `scheduled` handler in `src/worker.ts` delegates to
# `cron/radar-refresh.ts`, which force-refreshes `mcp:radar:cache:wire`
# and `mcp:radar:cache:fyi`. Budget protection (circuit breaker +
# day-counter soft cap) lives in the handler so this trigger is the
# only place the cadence is declared.
#
# **Cadence rule (BL-032.7 — Inoreader budget hardening)**: cron MUST
# fire at intervals >= the cache TTL (currently 6h, see resource-cache
# settings). Firing more often than the TTL re-fetches Inoreader while
# the cache is still warm — pure waste against the 100/day Zone-1 cap.
#
# Historical context: the Phase 4 initial config was `0 * * * *`
# (hourly), which over-fetched by 6× and was the load-bearing cause of
# the 2026-05-15 BL-032.6 demo-day Zone-1 exhaustion incident — see
# src/docs/adr/0006-inoreader-zone1-budget-protection.md (evidence: _archive/BL-032_5_TESTING_FINDINGS.md § Section Z).
# Corrected to `0 */6 * * *` (every 6h, top of UTC hour) on
# 2026-05-16; matches cache TTL exactly. Budget math: 4 firings ×
# 6 calls = 24/day under the 100/day Zone-1 cap.
#
# **2026-05-29 BL-032.77 discovery**: Cloudflare's `scheduled` handler
# may be invoked multiple times for the same scheduledTime (documented
# platform behavior). Production observation 2026-05-29 confirmed every
# firing was double-invoked, doubling the actual Zone-1 spend (36/day
# observed against 24 expected). Fixed via single-flight Upstash lock
# keyed on `event.cron:event.scheduledTime` at the top of the scheduled
# handler — losers exit cleanly and emit `cron_outcome:'deduplicated'`
# to AE so the dedup rate stays visible. Steady-state post-fix: 24/day
# as the budget math claims. Production-only — staging deliberately
# runs no cron (see staging block above).
#
# Second cron (`*/15 * * * *`) is the BL-032.75 Phase 3 SLO alert
# evaluator: every 15 minutes it evaluates the 7 canonical alert rules
# (AE SQL + Upstash + in-process health) and posts fingerprinted Sentry
# issue events for un-suppressed breaches. Requires the CF_AE_TOKEN +
# CF_ACCOUNT_ID secrets for the AE-backed rules; fails open without them.
# Note the :00-of-hours-0/6/12/18 overlap with the radar cron is safe —
# Cloudflare fires one invocation per expression with event.cron set,
# and each path's dedup-lock key includes the cron string.
#
# Alert evaluator:  src/observability/alert-evaluator.ts (+ alert-rules.ts)
# Operator runbook: src/docs/operations/SENTRY_ALERT_RULES.md
[env.production.triggers]
crons = ["0 */6 * * *", "*/15 * * * *"]