# Cloudflare Worker config for the GST MCP server (BL-032).
#
# Phase 1 scope: staging-only; minimal config to scaffold the Worker fetch
# handler and prove the end-to-end transport story works. Production env,
# routes, observability bindings, custom domain, and secret manifests land
# in Phase 6 (deploy + soak).
#
# Architecture & rationale: src/docs/development/MCP_SERVER_REMOTE_BL-032.md
#
# To run locally:
#   npm run dev:worker          # wrangler dev --env staging
#
# To deploy (Phase 6):
#   npm run deploy:staging      # wrangler deploy --env staging
#   npm run deploy:production   # wrangler deploy --env production

name = "gst-mcp"
main = "src/worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Emit source maps alongside the bundled Worker so deploy.mjs can ship them
# to Sentry via sentry-cli (Sentry → Cloudflare integration). Without this,
# Sentry stack traces show minified output (`dist/index.js:1:482718`); with
# it, traces resolve back to original TypeScript file:line. Source maps land
# in the `dist/` directory after `wrangler deploy --outdir dist
# --upload-source-maps` runs. Source-map upload itself is opt-in via
# SENTRY_AUTH_TOKEN in the deploy env; deploy.mjs warns + continues if
# missing so the chain doesn't break when the token isn't bound.
upload_source_maps = true

# nodejs_compat is required because the `agents` SDK pulls in `mimetext`
# (uses node:os) and `mime-types` (uses node:path) transitively through its
# observability module. Cloudflare's nodejs_compat layer polyfills these
# Node built-ins on the Worker runtime — well-supported, no functional
# impact on our code path.
#
# Our OWN code stays Web-API-only — we use v1 SDK's
# WebStandardStreamableHTTPServerTransport (via agents/mcp's createMcpHandler).
# Local-only tools/resources that DO use node:fs / node:crypto live in
# src/tools/_local-only.ts and are registered only by the stdio entrypoint
# (src/index.ts), never by this Worker. See BL-032 Q12.

# ---------------------------------------------------------------------------
# Staging
# ---------------------------------------------------------------------------
# Secrets (set via `wrangler secret put <NAME> --env staging`):
#   MCP_KEY_RP                    Bearer token for thefastcat (RP) — initial soak roster (Q11/Q13)
#
#   # Path 2 (Q13 / two-database architecture) — see DEPLOY.md § A.3 for the operator walkthrough.
#   UPSTASH_INOREADER_REST_URL    Website's Upstash DB URL (same as website's UPSTASH_REDIS_REST_URL)
#   UPSTASH_INOREADER_REST_TOKEN  Website-DB Read-Only token — Worker reads inoreader:* keys only
#   UPSTASH_MCP_REST_URL          New MCP-only Upstash DB URL (Worker-owned)
#   UPSTASH_MCP_REST_TOKEN        MCP-DB Standard token (read+write) for mcp:* keys
#
#   INOREADER_APP_ID              Copy from Vercel env via `vercel env pull`
#   INOREADER_APP_KEY             Copy from Vercel env
#   INOREADER_ACCESS_TOKEN        Copy from Vercel env (env fallback only — primary read is inoreader:access_token)
#   INOREADER_REFRESH_TOKEN       Copy from Vercel env (Worker reads only — see Q4 Resolved)
#   SENTRY_DSN                    Sentry project — service:mcp-server (Q6)
#
# Phase 1 spike runs locally via `wrangler dev` with no secrets set; the only
# code path exercised before Phase 2 ships auth is /health (uncached, no auth).

[env.staging]
name = "gst-mcp-staging"
routes = [
  { pattern = "mcp-staging.globalstrategic.tech", custom_domain = true }
]

# BL-032.5 Phase 4: hourly radar snapshot refresh. The `scheduled` handler
# in `src/worker.ts` delegates to `cron/radar-refresh.ts`, which force-
# refreshes `mcp:radar:cache:wire` and `mcp:radar:cache:fyi`. Budget
# protection (circuit breaker + day-counter soft cap) lives in the
# handler so this trigger is the only place the cadence is declared.
[env.staging.triggers]
crons = ["0 * * * *"]

# ---------------------------------------------------------------------------
# Production
# ---------------------------------------------------------------------------
# Same secret matrix as staging (with `--env production` values). Path 2:
# UPSTASH_INOREADER_REST_TOKEN = website-DB Read-Only token; UPSTASH_MCP_REST_TOKEN
# = MCP-DB Standard token. Independent rotation cadence per DB.

[env.production]
name = "gst-mcp"
routes = [
  { pattern = "mcp.globalstrategic.tech", custom_domain = true }
]

# Same hourly radar refresh as staging — see commentary above.
[env.production.triggers]
crons = ["0 * * * *"]